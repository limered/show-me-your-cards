services:
  - type: web
    name: show-me-your-cards
    runtime: docker
    dockerfilePath: ./Dockerfile
    numInstances: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: smyc-db
          property: connectionString

databases:
  - name: smyc-db
    databaseName: smyc
    user: smyc
